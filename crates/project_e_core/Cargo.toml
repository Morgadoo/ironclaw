[package]
name = "project-e-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Core types, traits, and infrastructure for Project E cognitive architecture"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "macros"] }
toml = "0.8"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
