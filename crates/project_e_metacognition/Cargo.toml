[package]
name = "project-e-metacognition"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Self-model, deliberation engine, evaluation, and policy for Project E"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
project-e-analysis = { path = "../project_e_analysis" }
project-e-core = { path = "../project_e_core" }
project-e-event-bus = { path = "../project_e_event_bus" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
toml = "0.8"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
