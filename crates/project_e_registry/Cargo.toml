[package]
name = "project-e-registry"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Module registry with PostgreSQL as single source of truth"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
project-e-core = { path = "../project_e_core" }
project-e-event-bus = { path = "../project_e_event_bus" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
