[package]
name = "project-e-skills"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "SKILL.md discovery, activation, and authoring for Project E"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
project-e-core = { path = "../project_e_core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
